name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:assembleDebug --init-script .github/workflows/init-dependencies.gradle --stacktrace

      - name: Verify APK Artifact
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file does not exist at $APK_PATH"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK file is empty at $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "APK generated successfully."
          echo "Location: $APK_PATH"
          echo "Size: $APK_SIZE"
          echo "SHA-256: $SHA256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
