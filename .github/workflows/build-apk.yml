name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_FILE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          gh release create "$RELEASE_TAG" "$APK_FILE" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --notes "Automatically generated debug APK for testing."

      - name: Report APK download result
        if: always()
        run: |
          echo "## APK Build Result" >> "$GITHUB_STEP_SUMMARY"

          if [ -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK generated successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "Download the app-debug-apk artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "APK was not generated. Check the failed build step." >> "$GITHUB_STEP_SUMMARY"
          fi