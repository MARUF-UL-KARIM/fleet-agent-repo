name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Download Gradle wrapper
        run: |
          mkdir -p fleet-agent/gradle/wrapper
          curl -fsSL -o fleet-agent/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o fleet-agent/gradle/wrapper/gradle-wrapper.properties \
            https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.properties
          curl -fsSL -o fleet-agent/gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew
          chmod +x fleet-agent/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fleet-agent/**/*.gradle*', 'fleet-agent/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: fleet-agent
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fleet-agent-debug
          path: fleet-agent/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30