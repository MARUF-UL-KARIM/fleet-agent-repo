name: Publish Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate APK and Checksum
        run: |
          APK_FILE="apk-distribution/app-debug.apk"
          SHA_FILE="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: $APK_FILE does not exist."
            exit 1
          fi

          if [ ! -s "$APK_FILE" ]; then
            echo "ERROR: $APK_FILE is empty."
            exit 1
          fi

          if [ ! -f "$SHA_FILE" ]; then
            echo "ERROR: $SHA_FILE does not exist."
            exit 1
          fi

          echo "Verifying APK archive integrity..."
          unzip -tq "$APK_FILE"

          echo "Verifying SHA-256 checksum match..."
          CALCULATED_SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')
          RECORDED_SHA=$(awk '{print $1}' "$SHA_FILE")

          echo "Calculated SHA-256: $CALCULATED_SHA"
          echo "Recorded SHA-256:   $RECORDED_SHA"

          if [ "$CALCULATED_SHA" != "$RECORDED_SHA" ]; then
            echo "ERROR: SHA-256 checksum mismatch!"
            exit 1
          fi

          echo "APK validation passed successfully."

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          APK_FILE="apk-distribution/app-debug.apk"

          gh release create "$RELEASE_TAG" "$APK_FILE" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Debug APK Release $RELEASE_TAG" \
            --notes "Automatically published debug APK pre-compiled in Google AI Studio." \
            --latest

      - name: Generate Job Summary
        if: success()
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          APK_FILE="apk-distribution/app-debug.apk"
          APK_SIZE=$(ls -lh "$APK_FILE" | awk '{print $5}')
          SHA256_HASH=$(sha256sum "$APK_FILE" | awk '{print $1}')
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          echo "### APK GitHub Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag:** \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Size:** \`${APK_SIZE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256:** \`${SHA256_HASH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Page:** [View Release](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Direct Download URL:** [Download app-debug.apk](${DOWNLOAD_URL})" >> "$GITHUB_STEP_SUMMARY"
